<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentFloor Console</title>
<style>
  :root {
    --ink: #0a0a0a; --muted: #6a6a66; --faint: #9a9893; --bg: #f7f6f3; --card: #fff; --line: #e7e4dd;
    --accent: #e8743b; --green: #3f9b5f; --amber: #d99a2b; --red: #d9534a; --violet: #7b6cd9; --blue: #3b7be8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: -0.02em; }
  header .live { font-size: 12px; color: var(--muted); }
  header .live b { color: var(--green); }
  main { display: grid; grid-template-columns: 260px 1fr 340px; gap: 16px; padding: 16px 20px; align-items: start; }
  main > * { min-width: 0; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; padding: 16px; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
  .agent { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 8px 6px; border-radius: 10px; cursor: pointer; }
  .agent:hover, .agent.sel { background: #f2efe9; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
  .dot.working { background: var(--green); animation: pulse 1.2s infinite; } .dot.waiting { background: var(--blue); }
  .dot.idle { background: #c9c5bd; } .dot.stopped { background: var(--red); } .dot.offline { background: #e2ded6; }
  @keyframes pulse { 50% { opacity: .35; } }
  .agent .name { font-weight: 600; } .agent .sub { font-size: 12px; color: var(--muted); }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #f0ede7; color: var(--muted); white-space: nowrap; }
  .chip.q { background: var(--red); color: #fff; }
  .room { font-size: 11px; color: var(--faint); margin: 10px 6px 2px; text-transform: uppercase; letter-spacing: .05em; }
  .thread { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .thread > .top { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #faf9f6; cursor: pointer; }
  .thread .tid { font: 12px ui-monospace, monospace; color: var(--muted); }
  .thread .topic { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { font-size: 11px; padding: 2px 8px; border-radius: 99px; }
  .state.open { background: #e8f0fd; color: var(--blue); } .state.resolved { background: #e7f4ec; color: var(--green); }
  .state.escalated { background: #fbeeee; color: var(--red); } .state.huddle { background: #efecfb; color: var(--violet); }
  .msgs { padding: 4px 12px 10px; }
  .msg { padding: 6px 0; border-top: 1px dashed var(--line); }
  .msg:first-child { border-top: 0; }
  .msg .meta { font-size: 12px; color: var(--muted); }
  .msg .meta b { color: var(--ink); }
  .msg .body { white-space: pre-wrap; }
  .msg.office .body { color: var(--muted); font-style: italic; }
  .pill { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 6px; background: #f0ede7; }
  .pill.urgent { background: #fdf3e1; color: var(--amber); } .pill.stop { background: var(--red); color: #fff; }
  .pend { color: var(--amber); font-size: 11px; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
  .item.resolved { opacity: .5; }
  .item .k { font-size: 11px; text-transform: uppercase; color: var(--accent); letter-spacing: .05em; }
  .item .t { font-weight: 600; margin: 2px 0 4px; } .item .b { white-space: pre-wrap; color: var(--muted); font-size: 13px; }
  textarea, input, select { width: 100%; font: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: #fff; }
  textarea { min-height: 56px; resize: vertical; }
  button { font: inherit; border: 0; border-radius: 99px; padding: 7px 14px; background: var(--ink); color: #fff; cursor: pointer; }
  button.sec { background: #ece9e3; color: var(--ink); }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row > * { flex: 1; }
  .task { display: grid; grid-template-columns: 1fr auto; gap: 4px; padding: 6px 0; border-top: 1px dashed var(--line); font-size: 13px; }
  .bar { grid-column: 1 / -1; height: 4px; background: #eee; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .err { color: var(--red); font-size: 12px; margin-top: 6px; }
  .empty { color: var(--faint); font-size: 13px; }
  .term { background: #141413; color: #e9e6df; border-radius: 12px; padding: 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; height: 360px; overflow: auto; margin-bottom: 14px; }
  .term .l { white-space: pre-wrap; word-break: break-word; margin: 0 0 4px; }
  .term .input { color: #f0b48a; } .term .tool { color: #8fb8f5; } .term .result { color: #8d8b86; }
  .term .error { color: #ff8a80; } .term .info { color: #6f6d68; } .term .text { color: #f4f1ea; }
  .term-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .term-head .cost { font-size: 12px; color: var(--muted); }
  .settings { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 14px; background: #faf9f6; }
  .settings .grid { display: grid; grid-template-columns: 1.1fr 1.4fr .8fr; gap: 8px; }
  .settings label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 4px; }
  .settings .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .readback { border: 1px solid #f1c9ad; background: #fff7f1; border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .readback .t { font-weight: 600; margin-bottom: 4px; }
  .readback ul { margin: 0 0 8px; padding-left: 18px; font-size: 13px; }
  .versions { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .filters button { padding: 4px 10px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1 id="office-name">AgentFloor</h1>
  <span class="live" id="live">connecting…</span>
</header>
<main>
  <div>
    <section><h2>Agents</h2><div id="agents"></div></section>
    <section style="margin-top:16px"><h2>Tasks</h2><div id="tasks"></div></section>
  </div>
  <section>
    <div id="settings"></div>
    <div id="session"></div>
    <h2>Threads</h2>
    <div class="filters" id="filters"></div>
    <div id="threads"></div>
  </section>
  <div>
    <section><h2>Needs you</h2><div id="inbox"></div></section>
    <section style="margin-top:16px">
      <h2>Message an agent</h2>
      <select id="to"></select>
      <textarea id="text" placeholder="Tell or ask them something…" style="margin-top:8px"></textarea>
      <div class="row">
        <select id="urgency"><option value="normal">Normal</option><option value="urgent">Urgent</option><option value="stop">Stop</option></select>
        <button id="send">Send</button>
        <button id="assign" class="sec">Assign task</button>
      </div>
      <div class="err" id="send-err"></div>
    </section>
  </div>
</main>
<script>
const TOKEN = "__CEO_TOKEN__";
let state = null;
let filter = { agent: null, kind: "all" };
const open = new Set();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const time = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

async function rpc(name, args) {
  const r = await fetch(`/rpc/${name}`, { method: "POST", headers: { "content-type": "application/json", authorization: `Bearer ${TOKEN}` }, body: JSON.stringify(args) });
  const b = await r.json();
  if (!b.ok) throw new Error(b.error.message);
  return b.result;
}

async function load() {
  const r = await fetch("/api/state", { headers: { authorization: `Bearer ${TOKEN}` } });
  state = await r.json();
  render();
}

function name(id) {
  if (id === "ceo") return "CEO";
  if (id === "office") return "Office";
  return state.office.agents.find((a) => a.id === id)?.name ?? id;
}

function tokens(u) {
  const k = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n));
  const cached = u.inputTokens ? Math.round((100 * (u.cacheReadTokens ?? 0)) / u.inputTokens) : 0;
  return `${k(u.inputTokens + u.outputTokens)} tok${cached ? ` (${cached}% cached)` : ""}${u.calls ? ` · ${u.calls} calls` : ""}${u.costUsd ? ` · $${u.costUsd.toFixed(3)}` : ""}`;
}

const runtimeLabel = (r) => state.catalog[r]?.label ?? r;
const modelLabel = (r, m) => state.catalog[r]?.models.find((x) => x.id === m)?.label ?? m ?? "";

// The settings card is drawn from `draft`, and only redrawn when what it shows changes.
let draft = null;
let settingsKey = "";
function renderSettings() {
  const id = filter.agent;
  const el = $("settings");
  if (!id) { el.innerHTML = ""; settingsKey = ""; draft = null; return; }
  const a = state.office.agents.find((x) => x.id === id);
  if (!draft || draft.agent !== id) draft = { agent: id, runtime: a.runtime, model: a.model, effort: a.effort ?? null, readback: null, error: "" };
  const mine = state.versions.filter((v) => v.agent === id);
  const key = JSON.stringify([draft, a.runtime, a.model, a.effort, mine.length]);
  if (key === settingsKey) return;
  settingsKey = key;
  const info = state.catalog[draft.runtime];
  const opts = (list, cur) => list.map((x) => `<option value="${esc(x.value)}" ${x.value === cur ? "selected" : ""}>${esc(x.label)}</option>`).join("");
  el.innerHTML = `<div class="settings">
    <h2>Settings · ${esc(a.name)}</h2>
    <div class="grid">
      <div><label>Runtime</label><select id="set-runtime">${opts(Object.entries(state.catalog).map(([k, v]) => ({ value: k, label: v.label })), draft.runtime)}</select></div>
      <div><label>Model</label><select id="set-model">${opts(info.models.map((m) => ({ value: m.id, label: m.label })), draft.model)}</select></div>
      <div><label>Effort</label><select id="set-effort" ${info.efforts.length ? "" : "disabled"}>${info.efforts.length ? opts(info.efforts.map((e) => ({ value: e, label: e })), draft.effort) : "<option>n/a</option>"}</select></div>
    </div>
    <div class="note">${esc(info.note)}</div>
    ${draft.readback ? `<div class="readback"><div class="t">Read-back: confirm this change</div><ul>${draft.readback.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
        <div class="row" style="margin-top:0"><button id="set-confirm">Confirm</button><button class="sec" id="set-cancel">Cancel</button></div></div>`
      : `<div class="row"><button id="set-review" class="sec">Review change</button></div>`}
    ${draft.error ? `<div class="err">${esc(draft.error)}</div>` : ""}
    ${mine.length ? `<div class="versions">${mine.slice(-3).reverse().map((v) => `v${v.v} · ${time(v.at)} · ${esc(v.summary)}`).join("<br>")}</div>` : ""}
  </div>`;
  $("set-runtime").onchange = (e) => {
    const r = e.target.value, ri = state.catalog[r];
    Object.assign(draft, { runtime: r, model: ri.defaultModel, effort: ri.defaultEffort, readback: null, error: "" });
    renderSettings();
  };
  $("set-model").onchange = (e) => { Object.assign(draft, { model: e.target.value, readback: null, error: "" }); renderSettings(); };
  const eff = $("set-effort");
  if (info.efforts.length) eff.onchange = (e) => { Object.assign(draft, { effort: e.target.value, readback: null, error: "" }); renderSettings(); };
  const args = () => ({ agent: id, runtime: draft.runtime, model: draft.model, ...(draft.effort ? { effort: draft.effort } : {}) });
  $("set-review")?.addEventListener("click", async () => {
    try {
      const r = await rpc("ceo_configure_agent", args());
      if (r.unchanged) { draft.readback = null; draft.error = r.changes[0]; }
      else { draft.readback = r.changes; draft.error = ""; }
    }
    catch (e) { draft.error = e.message; }
    renderSettings();
  });
  $("set-cancel")?.addEventListener("click", () => { draft = null; renderSettings(); });
  $("set-confirm")?.addEventListener("click", async () => {
    try { await rpc("ceo_configure_agent", { ...args(), confirm: true }); draft = null; }
    catch (e) { draft.error = e.message; }
    await load();
  });
}

const LABEL = { input: "▶ office", tool: "⚙", result: "  ↳", error: "✗", info: "·", text: "" };
function renderSession() {
  const id = filter.agent;
  if (!id) { $("session").innerHTML = ""; return; }
  const a = state.office.agents.find((x) => x.id === id);
  const lines = state.outputs[id] ?? [];
  const u = state.usage[id];
  const term = document.querySelector(".term");
  const atBottom = !term || term.scrollTop + term.clientHeight >= term.scrollHeight - 20;
  $("session").innerHTML = `<div class="term-head"><h2>Live session · ${esc(a.name)} <span class="chip">${esc(runtimeLabel(a.runtime))} · ${esc(modelLabel(a.runtime, a.model))}</span></h2>
      <span class="cost">${u ? `${u.turns} turns · ${tokens(u)}` : ""}</span></div>
    <div class="term">${lines.length ? lines.map((l) => `<div class="l ${l.kind}">${LABEL[l.kind] ? esc(LABEL[l.kind]) + " " : ""}${esc(l.text)}</div>`).join("") : '<div class="l info">No output yet.</div>'}</div>`;
  const t = document.querySelector(".term");
  if (atBottom) t.scrollTop = t.scrollHeight;
}

function render() {
  $("office-name").textContent = state.office.name;
  // Agents, by room
  $("agents").innerHTML = state.office.rooms.map((room) => `<div class="room">${esc(room.name)}</div>` +
    state.office.agents.filter((a) => a.room === room.id).map((a) => {
      const s = state.statuses[a.id];
      const q = state.queued[a.id];
      return `<div class="agent ${filter.agent === a.id ? "sel" : ""}" data-agent="${a.id}">
        <span class="dot ${s.status}"></span>
        <div><div class="name">${esc(a.name)}${a.role === "head" ? ' <span class="chip">Head</span>' : ""}</div>
        <div class="sub">${esc(s.status)}${state.activity?.[a.id] ? ` · <b style="color:var(--blue)">${esc(state.activity[a.id])}</b>` : ""}${s.detail ? " · " + esc(s.detail) : ""}${state.usage[a.id] ? ` · ${tokens(state.usage[a.id])}` : ""}</div></div>
        <div>${q ? `<span class="chip q" title="queued messages">${q}</span>` : `<span class="chip" title="${esc(runtimeLabel(a.runtime))}">${esc(modelLabel(a.runtime, a.model))}</span>`}</div>
      </div>`;
    }).join("")).join("");
  document.querySelectorAll("[data-agent]").forEach((el) => el.onclick = () => { filter.agent = filter.agent === el.dataset.agent ? null : el.dataset.agent; render(); });

  renderSettings();
  renderSession();

  // Tasks
  $("tasks").innerHTML = state.tasks.length ? state.tasks.map((t) => `<div class="task">
      <div><b>${esc(t.id)}</b> ${esc(t.title)}<div class="sub" style="color:var(--muted);font-size:12px">${esc(name(t.owner))} · ${esc(t.status)}${t.note ? " · " + esc(t.note) : ""}</div></div>
      <span class="chip">${t.progress}%</span><div class="bar"><i style="width:${t.progress}%"></i></div></div>`).join("")
    : `<div class="empty">No tasks yet.</div>`;

  // Thread filters
  const kinds = ["all", "open", "huddle", "escalated", "resolved"];
  $("filters").innerHTML = kinds.map((k) => `<button class="${filter.kind === k ? "" : "sec"}" data-kind="${k}">${k}</button>`).join("") +
    (filter.agent ? `<button class="sec" data-clear>× ${esc(name(filter.agent))}</button>` : "");
  document.querySelectorAll("[data-kind]").forEach((b) => b.onclick = () => { filter.kind = b.dataset.kind; render(); });
  document.querySelector("[data-clear]")?.addEventListener("click", () => { filter.agent = null; render(); });

  // Threads, newest activity first
  const byThread = new Map();
  for (const m of state.messages) {
    const list = byThread.get(m.threadId) ?? [];
    // One row per send: recipients of the same message share body, sender and time.
    const same = list.find((x) => x.from === m.from && x.body === m.body && x.createdAt === m.createdAt);
    if (same) { same.to.push(m.to); same.pending ||= m.state === "queued"; }
    else list.push({ ...m, to: [m.to], pending: m.state === "queued" });
    byThread.set(m.threadId, list);
  }
  const threads = [...state.threads].sort((a, b) => b.updatedAt - a.updatedAt).filter((t) =>
    (!filter.agent || t.participants.includes(filter.agent)) &&
    (filter.kind === "all" || (filter.kind === "huddle" ? t.kind === "huddle" : t.state === filter.kind)));
  $("threads").innerHTML = threads.length ? threads.map((t) => {
    const msgs = byThread.get(t.id) ?? [];
    const label = t.kind === "huddle" && t.state === "open" ? "huddle" : t.state;
    const isOpen = open.has(t.id) || t.state !== "resolved";
    return `<div class="thread">
      <div class="top" data-thread="${t.id}">
        <span class="tid">${t.id}</span>
        <span class="topic">${esc(t.topic)}</span>
        ${t.awaiting ? `<span class="chip" title="waiting">⏳ ${esc(name(t.awaiting.from))}</span>` : ""}
        ${t.depth ? `<span class="chip" title="follow-up of ${esc(t.parentId)}">hop ${t.depth}</span>` : ""}
        ${t.tokens ? `<span class="chip" title="model tokens spent on this thread">${t.tokens >= 1000 ? (t.tokens / 1000).toFixed(1) + "k" : t.tokens} tok</span>` : ""}
        <span class="state ${t.kind === "huddle" && t.state === "open" ? "huddle" : t.state}">${label}</span>
      </div>
      ${isOpen ? `<div class="msgs">${msgs.map((m) => `<div class="msg ${m.from === "office" ? "office" : ""}">
          <div class="meta"><b>${esc(name(m.from))}</b> → ${m.to.map((x) => esc(name(x))).join(", ")} · <span class="pill ${m.urgency}">${m.type}</span>
          ${m.urgency !== "normal" ? `<span class="pill ${m.urgency}">${m.urgency}</span>` : ""} · ${time(m.createdAt)}
          ${m.pending ? `<span class="pend">· queued</span>` : ""}</div>
          <div class="body">${esc(m.body)}</div></div>`).join("")}
          ${t.outcome ? `<div class="msg"><div class="meta"><b>Outcome</b></div><div class="body">${esc(t.outcome)}</div></div>` : ""}
        </div>` : ""}
    </div>`;
  }).join("") : `<div class="empty">No threads yet.</div>`;
  document.querySelectorAll("[data-thread]").forEach((el) => el.onclick = () => { open.has(el.dataset.thread) ? open.delete(el.dataset.thread) : open.add(el.dataset.thread); render(); });

  // Inbox
  const items = [...state.inbox].sort((a, b) => (a.state === b.state ? b.createdAt - a.createdAt : a.state === "open" ? -1 : 1));
  $("inbox").innerHTML = items.length ? items.map((i) => `<div class="item ${i.state}">
      <div class="k">${esc(i.kind)} · from ${esc(name(i.from))}${i.threadId ? " · " + i.threadId : ""}</div>
      <div class="t">${esc(i.title)}</div><div class="b">${esc(i.body)}</div>
      ${i.state === "open" ? `${i.threadId ? `<textarea data-answer="${i.threadId}" placeholder="Your answer…" style="margin-top:8px"></textarea>` : ""}
        <div class="row">${i.threadId ? `<button data-reply="${i.threadId}">Answer</button>` : ""}<button class="sec" data-done="${i.id}">Done</button></div>` : ""}
    </div>`).join("") : `<div class="empty">Nothing needs you.</div>`;
  document.querySelectorAll("[data-reply]").forEach((b) => b.onclick = async () => {
    const text = document.querySelector(`[data-answer="${b.dataset.reply}"]`).value.trim();
    if (!text) return;
    try { await rpc("ceo_reply", { thread_id: b.dataset.reply, text }); } catch (e) { alert(e.message); }
  });
  document.querySelectorAll("[data-done]").forEach((b) => b.onclick = () => rpc("resolve_inbox", { id: b.dataset.done }).catch((e) => alert(e.message)));

  // Recipient picker (keep the selection)
  const sel = $("to").value;
  $("to").innerHTML = state.office.agents.map((a) => `<option value="${a.id}">${esc(a.name)} (${a.id})</option>`).join("");
  if (sel) $("to").value = sel;
}

$("send").onclick = async () => {
  $("send-err").textContent = "";
  const text = $("text").value.trim();
  if (!text) return;
  try { await rpc("ceo_message", { to: $("to").value, text, urgency: $("urgency").value }); $("text").value = ""; }
  catch (e) { $("send-err").textContent = e.message; }
};
$("assign").onclick = async () => {
  $("send-err").textContent = "";
  const text = $("text").value.trim();
  if (!text) return;
  try { await rpc("ceo_assign", { to: $("to").value, title: text }); $("text").value = ""; }
  catch (e) { $("send-err").textContent = e.message; }
};

// Live: reload state on any event (debounced); EventSource reconnects by itself.
let pending = null;
let lastSeq = 0;
function connect() {
  const es = new EventSource(`/api/events?token=${encodeURIComponent(TOKEN)}&after=${lastSeq}`);
  es.onopen = () => $("live").innerHTML = "<b>●</b> live";
  es.onerror = () => $("live").textContent = "reconnecting…";
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "agent.activity") {
      if (state) { (state.activity ??= {})[ev.data.agent] = ev.data.activity; if (!ev.data.activity) delete state.activity[ev.data.agent]; render(); }
      return;
    }
    if (ev.type === "model.call") { clearTimeout(pending); pending = setTimeout(load, 300); return; }
    if (ev.type === "agent.output") {
      // Live lines append without reloading everything.
      if (state) {
        const buf = (state.outputs[ev.data.agent] ??= []);
        buf.push({ at: ev.data.at, kind: ev.data.kind, text: ev.data.text });
        if (ev.data.agent === filter.agent) renderSession();
      }
      return;
    }
    lastSeq = ev.seq;
    clearTimeout(pending);
    pending = setTimeout(load, 120);
  };
}
load().then(() => { lastSeq = 0; connect(); });
</script>
</body>
</html>
